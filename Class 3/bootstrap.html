<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

  <style>
    .sidebar{
      background-color: #FFF2DF;
    }

    .main-content {
      background-color: #E7F3E7;
    }

    .article {
      background-color: #f3e5f6;
    }

    .feature-1 {
      background-color: #FEF8E0;
    }

    .feature-2 {
      background-color: #DFF3FC;
    }

    .footer {
      background-color: #FBE4EC;
    }
  </style>
</head>
<body class="p-4 text-center">

  <div class="bg-info-subtle p-4 fs-4 fw-semibold">Header - Full Width (col-12)</div>

  <div class="row">
    <div class="sidebar col-sm-12 col-md-4 col-lg-3 p-4 fw-semibold">
      Sidebar
    </div>
    <div class="main-content col-sm-12 row col-md-8 col-lg-9 p-4 fw-semibold">
      Main Content Area
      <br>
      Near Grid Inside Main Content

        <div class="article col-md-12 col-lg-6 p-4 ">Article 1</div>
        <div class="article col-md-12 col-lg-6 p-4">Article 2</div>

    </div>
    
    <div class="row">
      <div class="feature-1 col-lg-4 col-md-6 col-sm-12 p-4">Feature 1</div>
      <div class="feature-2 col-lg-4 col-md-6 col-sm-12 p-4">Feature 2</div>
      <div class="article col-lg-4 col-md-12 p-4">Feature 3</div>
    </div>
  </div>

  
  <footer class="footer p-4">
    Footer
  </footer>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
